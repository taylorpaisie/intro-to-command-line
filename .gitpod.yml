# Ona (formerly Gitpod) configuration
# Learn more: https://www.gitpod.io/docs/references/gitpod-yml

image: gitpod/workspace-full

tasks:
  - name: Setup and Serve
    init: |
      gem install bundler
      bundle init
      bundle add jekyll webrick
      bundle install
    command: |
      bundle exec jekyll serve --host 0.0.0.0 --port 4000

ports:
  - port: 4000
    onOpen: open-preview
    visibility: public

vscode:
  extensions:
    - yzhang.markdown-all-in-one
    - DavidAnson.vscode-markdownlint
